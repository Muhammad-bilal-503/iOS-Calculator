<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <!-- Theme Toggle Button (Top-Left, Always Visible) -->
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">☀️</span>
            </button>

            <!-- Display -->
            <div class="display">
                <div class="display-expression" id="expression">0</div>
                <div class="display-result" id="result"></div>
            </div>

            <!-- Basic Mode -->
            <div id="basicMode" class="calculator-mode active">
                <div class="buttons-basic">
                    <!-- Row 1 - 4 buttons -->
                    <button class="btn btn-function" data-action="clear">AC</button>
                    <button class="btn btn-function" data-action="delete">DEL</button>
                    <button class="btn btn-function" data-action="negate">±</button>
                    <button class="btn btn-operator" data-value="/">÷</button>

                    <!-- Row 2 -->
                    <button class="btn btn-number" data-value="7">7</button>
                    <button class="btn btn-number" data-value="8">8</button>
                    <button class="btn btn-number" data-value="9">9</button>
                    <button class="btn btn-operator" data-value="*">×</button>

                    <!-- Row 3 -->
                    <button class="btn btn-number" data-value="4">4</button>
                    <button class="btn btn-number" data-value="5">5</button>
                    <button class="btn btn-number" data-value="6">6</button>
                    <button class="btn btn-operator" data-value="-">−</button>

                    <!-- Row 4 -->
                    <button class="btn btn-number" data-value="1">1</button>
                    <button class="btn btn-number" data-value="2">2</button>
                    <button class="btn btn-number" data-value="3">3</button>
                    <button class="btn btn-operator" data-value="+">+</button>

                    <!-- Row 5 -->
                    <button class="btn btn-number" data-value="0">0</button>
                    <button class="btn btn-number" data-value=".">.</button>
                    <button class="btn btn-function" data-value="%">%</button>
                    <button class="btn btn-equals" data-action="equals">=</button>
                </div>
            </div>

            <!-- Scientific Mode -->
            <div id="scientificMode" class="calculator-mode">
                <div class="buttons-scientific">
                    <!-- Row 1: Angle mode and controls -->
                    <button id="angleMode" class="btn btn-control" aria-label="Toggle angle mode">
                        <span id="angleModeText">DEG</span>
                    </button>
                    <button class="btn btn-function" data-action="clear">AC</button>
                    <button class="btn btn-function" data-action="delete">DEL</button>
                    <button class="btn btn-operator" data-value="(">(</button>
                    <button class="btn btn-operator" data-value=")">)</button>

                    <!-- Row 2: Trig functions -->
                    <button class="btn btn-function" data-value="sin(">sin</button>
                    <button class="btn btn-function" data-value="cos(">cos</button>
                    <button class="btn btn-function" data-value="tan(">tan</button>
                    <button class="btn btn-function" data-value="log(">log</button>
                    <button class="btn btn-function" data-value="ln(">ln</button>

                    <!-- Row 3: Inverse trig -->
                    <button class="btn btn-function" data-value="asin(">asin</button>
                    <button class="btn btn-function" data-value="acos(">acos</button>
                    <button class="btn btn-function" data-value="atan(">atan</button>
                    <button class="btn btn-function" data-value="sqrt(">√</button>
                    <button class="btn btn-function" data-value="^2">x²</button>

                    <!-- Row 4: Powers and special -->
                    <button class="btn btn-function" data-value="^">x^y</button>
                    <button class="btn btn-function" data-value="^3">x³</button>
                    <button class="btn btn-function" data-value="exp(">e^x</button>
                    <button class="btn btn-function" data-value="10^">10^x</button>
                    <button class="btn btn-function" data-value="cbrt(">∛</button>

                    <!-- Row 5: Constants and functions -->
                    <button class="btn btn-function" data-value="pi">π</button>
                    <button class="btn btn-function" data-value="e">e</button>
                    <button class="btn btn-function" data-value="!">x!</button>
                    <button class="btn btn-function" data-value="abs(">|x|</button>
                    <button class="btn btn-function" data-value="1/">1/x</button>

                    <!-- Row 6: Numbers -->
                    <button class="btn btn-number" data-value="7">7</button>
                    <button class="btn btn-number" data-value="8">8</button>
                    <button class="btn btn-number" data-value="9">9</button>
                    <button class="btn btn-operator" data-value="/">÷</button>
                    <button class="btn btn-function" data-value="%">%</button>

                    <!-- Row 7: Numbers -->
                    <button class="btn btn-number" data-value="4">4</button>
                    <button class="btn btn-number" data-value="5">5</button>
                    <button class="btn btn-number" data-value="6">6</button>
                    <button class="btn btn-operator" data-value="*">×</button>
                    <button class="btn btn-function" data-action="negate">±</button>

                    <!-- Row 8: Numbers -->
                    <button class="btn btn-number" data-value="1">1</button>
                    <button class="btn btn-number" data-value="2">2</button>
                    <button class="btn btn-number" data-value="3">3</button>
                    <button class="btn btn-operator" data-value="-">−</button>
                    <button class="btn btn-function" data-value="EE">EE</button>

                    <!-- Row 9: Bottom -->
                    <button class="btn btn-number" data-value="0">0</button>
                    <button class="btn btn-number" data-value=".">.</button>
                    <button class="btn btn-equals" data-action="equals">=</button>
                    <button class="btn btn-operator" data-value="+">+</button>
                    <button class="btn btn-function" data-value="rand">Rand</button>
                </div>
            </div>

            <!-- Math Notes Mode -->
            <div id="mathNotesMode" class="calculator-mode">
                <div class="canvas-container">
                    <canvas id="drawingCanvas"></canvas>
                </div>
                <div class="drawing-tools">
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="pen" title="Pen">
                            <span>✏️</span>
                        </button>
                        <button class="tool-btn" data-tool="eraser" title="Eraser">
                            <span>🧹</span>
                        </button>
                        <button class="tool-btn" data-action="clear-canvas" title="Clear All">
                            <span>🗑️</span>
                        </button>
                    </div>
                    <div class="tool-group">
                        <label class="tool-label">Color:</label>
                        <div class="color-picker">
                            <button class="color-btn active" data-color="#000000" style="background: #000000;"></button>
                            <button class="color-btn" data-color="#2563eb" style="background: #2563eb;"></button>
                            <button class="color-btn" data-color="#dc2626" style="background: #dc2626;"></button>
                            <button class="color-btn" data-color="#16a34a" style="background: #16a34a;"></button>
                            <button class="color-btn" data-color="#9333ea" style="background: #9333ea;"></button>
                        </div>
                    </div>
                    <div class="tool-group">
                        <label class="tool-label">Size:</label>
                        <input type="range" id="strokeWidth" min="1" max="10" value="3" class="stroke-slider">
                        <span id="strokeValue" class="stroke-value">3</span>
                    </div>
                </div>
            </div>

            <!-- Mode Switch Button - Bottom-Left Corner -->
            <button id="modeSwitch" class="mode-switch" aria-label="Switch calculator mode">
                <span class="mode-icon">☰</span>
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
